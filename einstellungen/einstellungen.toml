# Startplatz-Finder Südtirol – zentrale Einstellungen
#
# Alle einstellbaren Werte stehen hier. Die Skripte in analyse/ lesen nur diese
# Datei, damit nichts fest im Code steht.

[testgebiet]
name = "Rittner Horn"
# Koordinatensystem der Provinz Bozen: ETRS89 / UTM Zone 32N
crs = "EPSG:25832"
# Gipfel Rittner Horn (OSM-Knoten 424414599), auf 10 m gerundet
mitte_x = 688460
mitte_y = 5165330
# Kantenlänge des quadratischen Testgebiets in Metern (6 × 6 km)
kantenlaenge_m = 6000

[hoehenmodelle]
# Web Coverage Service (WCS) der Provinz Bozen
wcs_url = "https://geoservices9.civis.bz.it/geoserver/ows"
wcs_version = "2.0.1"
dgm_layer = "p_bz-Elevation:DigitalTerrainModel-2.5m"
dom_layer = "p_bz-Elevation:DigitalElevationModel-2.5m"
aufloesung_m = 2.5

[orthofoto]
# Kartendienst (WMS) der Provinz Bozen – nur als Hintergrund zur Kontrolle
wms_url = "https://geoservices.buergernetz.bz.it/mapproxy/ows"
layer = "p_bz-Orthoimagery:Aerial-2023-RGB"

[osm]
# Overpass-Server (Spiegel mit denselben OSM-Daten), werden der Reihe nach versucht
overpass_urls = [
  "https://overpass-api.de/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
]
user_agent = "Startplatz-Finder-Suedtirol/0.1 (https://github.com/paradata24/where-)"

[objekthoehe]
# Ab dieser Höhe (DOM minus DGM) gilt eine Zelle als Baum/Objekt
baum_ab_m = 3.0
# Höhen über diesem Wert werden als vermutliche Datenfehler gemeldet
unplausibel_ab_m = 60.0
# Negative Werte unter dieser Grenze werden als Datenfehler gemeldet
negativ_grenze_m = -1.0

[gesamtgebiet]
# Für die spätere Berechnung ganz Südtirols (Phase 3): Die Höhenmodelle werden
# in quadratischen Kacheln dieser Kantenlänge geladen und verarbeitet.
# 20 km = 8000 × 8000 Zellen, ca. 270 MB je Kachel (Test am 04.10.2026: 73 s).
kachel_m = 20000
